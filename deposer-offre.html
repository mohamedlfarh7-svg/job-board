<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Déposer une Offre - JobBoard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Job<span>Board</span></a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html" class="nav-link">Offres</a></li>
          <li><a href="offres-suivies.html" class="nav-link">Offres Suivies</a></li>
          <li><a href="deposer-offre.html" class="btn btn-primary active">+ Déposer une offre</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="form-card">
      <h1 class="hero-title" style="text-align: left; font-size: 2rem; margin-bottom: 8px;">Publier une offre d'emploi</h1>
      <p class="hero-subtitle" style="text-align: left; margin-bottom: 32px; font-size: 0.95rem;">Remplissez le formulaire ci-dessous pour trouver vos futurs talents.</p>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="title">Titre de l'offre *</label>
          <input type="text" id="title" class="form-control" placeholder="ex: Développeur Full-stack React/Node" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label for="company">Entreprise *</label>
            <input type="text" id="company" class="form-control" placeholder="ex: Digiglow" required>
          </div>

          <div class="form-group">
            <label for="contract">Type de contrat *</label>
            <select id="contract" class="form-control" required>
              <option value="">Sélectionner...</option>
              <option value="stage">Stage</option>
              <option value="alternance">Alternance</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label for="location">Localisation *</label>
            <input type="text" id="location" class="form-control" placeholder="ex: Casablanca / Remote" required>
          </div>

          <div class="form-group">
            <label for="email">Email de contact *</label>
            <input type="email" id="email" class="form-control" placeholder="recrutement@entreprise.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description complète de l'offre *</label>
          <textarea id="description" class="form-control" placeholder="Missions, technologies utilisées, prérequis..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px;">Publier l'annonce</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 JobBoard. Projet Full-Stack Développé pour YouCode.</p>
    </div>
  </footer>

</body>
</html>
